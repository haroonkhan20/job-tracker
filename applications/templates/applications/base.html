{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}JobTracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'applications/style.css' %}">
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar">
        <div class="brand">📋 JobTracker</div>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'application_list' %}">Applications</a>
            <a href="{% url 'resume_list' %}">My Resumes</a>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="link-style">Log Out</button>
            </form>
        </div>
    </nav>
    {% endif %}
    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
