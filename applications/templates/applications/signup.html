{% extends "applications/base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<h1>Create Account</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
</form>
<a href="{% url 'login' %}">Already have an account? Log in</a>
{% endblock %}
